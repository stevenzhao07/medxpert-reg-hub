[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medxpert-reg-hub"
version = "2.0.1"
description = "Medical-device regulatory MCP server: NMPA UDI, FDA 510(k)/PMA/classification, 20-hub knowledge-base lookups (read-only)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["mcp>=2.1.1"]
keywords = ["mcp", "mcp-server", "medical-device", "regulatory", "nmpa", "fda", "510k", "pma", "udi"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Healthcare Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Medical Science Apps."
]

[project.urls]
Homepage = "https://medxpert.cn"
Repository = "https://github.com/stevenzhao07/medxpert-reg-hub"

[project.scripts]
medxpert-mcp = "server:main"

[tool.setuptools]
py-modules = ["server"]
