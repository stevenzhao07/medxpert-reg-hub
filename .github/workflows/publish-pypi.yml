name: Publish PyPI

# Trusted Publishing（OIDC 零 token）优先；若 PyPI 侧尚未注册 pending publisher，
# 回退到仓库密钥 PYPI_API_TOKEN。最后一步回读 PyPI，杜绝"报成功但没发出去"。
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pypi
    env:
      UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Build wheel from mcp/
        working-directory: mcp
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build --sdist --wheel

      - name: Publish to PyPI (Trusted Publishing)
        id: oidc
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: mcp/dist
          print-hash: true

      - name: Publish to PyPI (API token fallback)
        if: steps.oidc.outcome == 'failure' && env.UV_PUBLISH_TOKEN != ''
        continue-on-error: true
        working-directory: mcp
        run: |
          python -m pip install --upgrade pip uv
          uv publish --token "$UV_PUBLISH_TOKEN"
      - name: Verify the version is actually on PyPI
        if: always()
        env:
          PKG: medxpert-reg-hub
          MANIFEST: mcp/pyproject.toml
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import json, os, re, sys, time, urllib.request
          pkg = os.environ["PKG"]
          want = (os.environ.get("TAG") or "").lstrip("v")
          if not want:
              # workflow_dispatch has no tag: fall back to the version declared in the manifest
              txt = open(os.environ["MANIFEST"], encoding="utf-8").read()
              m = re.search(r'^version\s*=\s*"([^"]+)"', txt, re.M)
              want = m.group(1) if m else ""
              print("no tag event; manifest says %s" % want)
          if not want:
              print("cannot determine a version to verify")
              sys.exit(1)
          op = urllib.request.build_opener()
          for attempt in range(12):
              try:
                  with op.open("https://pypi.org/pypi/%s/json" % pkg, timeout=20) as r:
                      have = list((json.load(r).get("releases") or {}).keys())
                  if want in have:
                      print("VERIFIED %s %s on PyPI" % (pkg, want))
                      sys.exit(0)
                  print("poll %d: %s not released yet (latest known: %s)" % (attempt + 1, want, have[-3:]))
              except Exception as e:
                  print("poll %d error: %s" % (attempt + 1, e))
              time.sleep(10)
          print("NOT ON PYPI: %s %s - the publish step reported success but published nothing" % (pkg, want))
          sys.exit(1)
          PY
