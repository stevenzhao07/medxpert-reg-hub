name: Publish PyPI

# Trusted Publishing（OIDC 零 token）优先；若 PyPI 侧尚未注册 pending publisher，
# 自动回退到仓库密钥 PYPI_API_TOKEN，避免出现"构建成功、发布失败"的空转流水线。
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    env:
      UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel from mcp/
        working-directory: mcp
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build --sdist --wheel

      - name: Publish to PyPI (Trusted Publishing)
        id: oidc
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: mcp/dist
          print-hash: true

      - name: Publish to PyPI (API token fallback)
        if: steps.oidc.outcome == 'failure' && env.UV_PUBLISH_TOKEN != ''
        working-directory: mcp
        run: |
          python -m pip install --upgrade pip uv
          uv publish --token "$UV_PUBLISH_TOKEN"
