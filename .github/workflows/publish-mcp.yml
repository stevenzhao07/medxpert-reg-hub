name: Publish MCP to Official Registry

# OIDC 零凭据发布：tag 触发 + 手动触发（首次用 workflow_dispatch）。
# mcp-publisher login github-oidc 用仓库属主身份获得 io.github.stevenzhao07/* 命名空间授权。

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-mcp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync server.json version with tag
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          python - <<'PY'
          import json, os
          tag = os.environ["TAG"].lstrip("v")
          with open("server.json", encoding="utf-8") as f:
              d = json.load(f)
          d["version"] = tag
          d["packages"][0]["version"] = tag
          with open("server.json", "w", encoding="utf-8") as f:
              json.dump(d, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY
          git diff --exit-code -- server.json || true

      - name: Publish to MCP Registry (GitHub OIDC)
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher validate server.json
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      - name: Verify on registry
        run: |
          for _ in $(seq 30); do
            curl -fsS "https://registry.modelcontextprotocol.io/v0.1/servers/io.github.stevenzhao07%2Fmedxpert-reg-hub/versions/latest" && exit 0
            sleep 10
          done
          echo "registry entry not visible after 5 min" >&2
          exit 1
