name: Publish MCP to Official Registry

# OIDC 零凭据发布：tag 触发 + 手动触发（首次用 workflow_dispatch）。
# mcp-publisher login github-oidc 用仓库属主身份获得 io.github.stevenzhao07/* 命名空间授权。

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-mcp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Sync server.json version with tag
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          python - <<'PY'
          import json, os
          tag = os.environ["TAG"].lstrip("v")
          with open("server.json", encoding="utf-8") as f:
              d = json.load(f)
          d["version"] = tag
          d["packages"][0]["version"] = tag
          with open("server.json", "w", encoding="utf-8") as f:
              json.dump(d, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY
          git diff --exit-code -- server.json || true

      - name: Check whether this version is already registered
        id: check
        run: |
          NAME=$(python3 -c "import json;print(json.load(open('server.json'))['name'])")
          VER=$(python3 -c "import json;print(json.load(open('server.json'))['version'])")
          ENC=$(python3 -c "import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe=''))" "$NAME")
          echo "checking $NAME@$VER"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://registry.modelcontextprotocol.io/v0/servers/$ENC/versions/$VER")
          if [ "$CODE" = "200" ]; then
            echo "already_exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::already registered (HTTP $CODE), publish skipped"
          else
            echo "already_exists=false" >> "$GITHUB_OUTPUT"
            echo "not registered yet (HTTP $CODE), publishing"
          fi


      - name: Wait until PyPI serves this version
        if: steps.check.outputs.already_exists == 'false'
        run: |
          python3 - <<'PY'
          import json, sys, time, urllib.request
          raw = json.load(open("server.json", encoding="utf-8"))
          srv = raw[0] if isinstance(raw, list) else raw
          pkg = [p for p in srv.get("packages", []) if p.get("registryType") == "pypi"]
          if not pkg:
              print("no pypi package in server.json - nothing to wait for"); sys.exit(0)
          name, ver = pkg[0]["identifier"], pkg[0]["version"]
          want = "mcp-name: " + srv["name"]
          deadline = time.time() + 300
          while time.time() < deadline:
              try:
                  with urllib.request.urlopen("https://pypi.org/pypi/%s/json" % name, timeout=20) as r:
                      d = json.loads(r.read())
              except Exception as e:
                  print("pypi not reachable yet: %s" % e); time.sleep(15); continue
              files = (d.get("releases") or {}).get(ver, [])
              desc = (d.get("info") or {}).get("description") or ""
              if files and want in desc:
                  print("OK: %s %s has %d files and the ownership marker" % (name, ver, len(files)))
                  sys.exit(0)
              print("%s %s not ready yet (files=%d, marker=%s)" % (name, ver, len(files), want in desc))
              time.sleep(15)
          print("TIMEOUT: %s %s never appeared on PyPI with the ownership marker" % (name, ver))
          sys.exit(1)
          PY

      - name: Publish to MCP Registry (GitHub OIDC)
        if: steps.check.outputs.already_exists == 'false'
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher validate server.json
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      - name: Verify on registry
        run: |
          for _ in $(seq 30); do
            curl -fsS "https://registry.modelcontextprotocol.io/v0.1/servers/io.github.stevenzhao07%2Fmedxpert-reg-hub/versions/latest" && exit 0
            sleep 10
          done
          echo "registry entry not visible after 5 min" >&2
          exit 1
